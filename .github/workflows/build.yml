name: Build

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.29.2
    env:
      ZEPHYR_SDK_INSTALL_DIR: /opt/toolchains
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: example-application
          fetch-depth: 0
          persist-credentials: false

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            zephyr
            modules
            bootloader
            tools
          key: west-${{ hashFiles('example-application/west.yml') }}
          restore-keys: |
            west-

      - name: West init (local)
        run: west init -l example-application

      - name: West update
        run: west update --narrow -o=--depth=1

      - name: Build firmware (Twister)
        working-directory: example-application
        run: west twister -T app -v --inline-logs --integration

      - name: Run unit/integration tests (Twister)
        working-directory: example-application
        run: west twister -T tests -v --inline-logs --integration

      - name: Upload Twister results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twister-results
          path: example-application/twister-out/
          if-no-files-found: ignore
